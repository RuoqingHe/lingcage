[package]
authors.workspace = true
description = "Building blocks for agentic-workload VMMs."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "lingcore"
repository.workspace = true
version.workspace = true

[features]
default = ["hv"]
# Kernel loading into guest RAM. x86_64 only.
boot = ["dep:linux-loader", "hv", "mem"]
# Guest-facing devices, serde carries their state.
devices = ["dep:serde", "dep:serde_json", "vcpu"]
# Hypervisor backends, only KVM is implemented for now.
hv = []
# Guest assembly, RAM, kernel, bus and the run loop. x86_64 Linux only.
machine = ["boot", "devices", "hv", "mem", "serde", "vcpu", "virtio"]
# serde derives on the hv state types.
serde = ["dep:serde"]
# Guest RAM, held as vm-memory regions.
mem = ["dep:libc", "dep:vm-memory"]
# vCPU run loop and the bus which it dispatches to.
vcpu = ["hv"]
# Virtio devices and the split virtqueue.
virtio = ["devices", "mem"]
# KVM backend.
kvm = [
  "dep:kvm-bindings",
  "dep:kvm-ioctls",
  "dep:libc",
  "dep:serde",
  "dep:serde_json",
  "dep:vmm-sys-util",
  "hv",
]

[lints]
workspace = true

[dependencies]
linux-loader = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
vm-memory = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { workspace = true, optional = true }
kvm-ioctls = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
vmm-sys-util = { workspace = true, optional = true }
