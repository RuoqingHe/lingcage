[package]
authors.workspace = true
categories.workspace = true
description = "Building blocks for agentic-workload VMMs."
edition.workspace = true
homepage.workspace = true
keywords = ["hypervisor", "kvm", "microvm", "virtio", "vmm"]
license.workspace = true
name = "lingcore"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu"]

[[bin]]
name = "lingcore"
path = "src/bin/lingcore.rs"
required-features = ["cli"]

[features]
default = ["hv"]
# ACPI tables in guest RAM. x86_64 only.
acpi = ["dep:acpi_tables", "mem"]
# Kernel loading into guest RAM. aarch64, x86_64 and riscv64 only.
boot = ["dep:linux-loader", "hv", "mem"]
# Device tree in guest RAM. aarch64 and riscv64 only.
fdt = ["dep:vm-fdt", "mem"]
# Guest-facing devices, serde carries their state.
devices = ["dep:serde", "dep:serde_json", "vcpu"]
# Hypervisor backends and the Linux mechanisms under them, libc for poll(2).
hv = ["dep:libc"]
# Guest assembly, RAM, kernel, bus and the run loop. aarch64, x86_64 and
# riscv64 Linux only.
machine = [
  "acpi",
  "boot",
  "devices",
  "fdt",
  "hv",
  "mem",
  "netstack",
  "seccomp",
  "serde",
  "vcpu",
  "virtio",
]
# serde derives on the hv state types.
serde = ["dep:serde"]
# Guest RAM, held as vm-memory regions.
mem = ["dep:libc", "dep:vm-memory"]
# Per-thread syscall allowlists. aarch64, x86_64 and riscv64 Linux only.
seccomp = ["dep:libc", "dep:seccompiler"]
# vCPU run loop and the bus which it dispatches to.
vcpu = ["hv"]
# The `lingcore` binary, boots a guest with KVM. aarch64, x86_64 and
# riscv64 Linux only.
cli = ["kvm", "machine"]
# Virtio devices and the split virtqueue.
virtio = ["devices", "mem"]
# Network stack behind the virtio-net device, guest frames are translated
# to host sockets in this process.
netstack = ["dep:libc", "dep:smoltcp", "virtio"]
# KVM backend.
kvm = [
  "dep:kvm-bindings",
  "dep:kvm-ioctls",
  "dep:libc",
  "dep:serde",
  "dep:serde_json",
  "dep:vmm-sys-util",
  "hv",
]

[lints]
workspace = true

[dependencies]
acpi_tables = { workspace = true, optional = true }
linux-loader = { workspace = true, optional = true }
log.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
smoltcp = { workspace = true, optional = true }
thiserror.workspace = true
vm-memory = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { workspace = true, optional = true }
kvm-ioctls = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
seccompiler = { workspace = true, optional = true }
vmm-sys-util = { workspace = true, optional = true }

# Device tree writer, for the architectures which boot with a tree. A
# bzImage guest names its devices in ACPI instead.
[target.'cfg(any(target_arch = "aarch64", target_arch = "riscv64"))'.dependencies]
vm-fdt = { workspace = true, optional = true }
