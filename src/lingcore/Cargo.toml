[package]
authors.workspace = true
description = "Building blocks for agentic-workload VMMs."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "lingcore"
repository.workspace = true
version.workspace = true

[features]
default = ["hv"]
# Hypervisor backends, only KVM is implemented for now.
hv = []
# Guest RAM, held as vm-memory regions.
mem = ["dep:vm-memory"]
# vCPU run loop and the bus which it dispatches to.
vcpu = ["hv"]
# KVM backend.
kvm = [
  "dep:kvm-bindings",
  "dep:kvm-ioctls",
  "dep:libc",
  "dep:serde",
  "dep:serde_json",
  "dep:vmm-sys-util",
  "hv",
]

[lints]
workspace = true

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
vm-memory = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = { workspace = true, optional = true }
kvm-ioctls = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
vmm-sys-util = { workspace = true, optional = true }
