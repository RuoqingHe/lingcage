[package]
authors.workspace = true
categories.workspace = true
description = "Secure agent infrastructure that cages AI agents with minimum overhead."
edition.workspace = true
homepage.workspace = true
keywords = ["agent", "isolation", "microvm", "sandbox", "vmm"]
license.workspace = true
name = "lingcage"
repository.workspace = true
rust-version.workspace = true
version = "0.2.0"

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["aarch64-unknown-linux-gnu", "riscv64gc-unknown-linux-gnu"]

[[bin]]
name = "lingcage"
path = "src/bin/lingcage.rs"
required-features = ["cli"]

[[bin]]
name = "lingcage-agent"
path = "src/bin/lingcage-agent.rs"
required-features = ["agent"]

[dependencies]
libc = { workspace = true, optional = true }
lingcore = { workspace = true, features = ["kvm", "machine"], optional = true }
log = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
# Guest protocol, framing and messages, shared by host and guest.
lcp = ["dep:serde", "dep:serde_json", "dep:thiserror"]
# Guest agent, connect, identity, exec. Linux only.
agent = ["dep:libc", "lcp"]
# Templates, sealed and verified spawn sources. aarch64, x86_64 and
# riscv64 Linux only.
template = ["dep:libc", "dep:lingcore", "dep:log", "dep:sha2", "lcp"]
# Sandboxes, guests cloned from templates in this process. aarch64,
# x86_64 and riscv64 Linux only.
sandbox = ["template"]
# Operator front end, the `lingcage` binary.
cli = ["sandbox"]

[lints]
workspace = true
