[package]
authors.workspace = true
description = "Secure agent infrastructure that cages AI agents with minimum overhead."
edition.workspace = true
homepage.workspace = true
license.workspace = true
name = "lingcage"
repository.workspace = true
version.workspace = true

[[bin]]
name = "lingcage-agent"
path = "src/bin/lingcage-agent.rs"
required-features = ["agent"]

[dependencies]
libc = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
default = []
# Guest protocol, framing and messages, shared by host and guest.
lcp = ["dep:serde", "dep:serde_json", "dep:thiserror"]
# Guest agent, connect, identity, exec. Linux only.
agent = ["dep:libc", "lcp"]
# Templates, sealed and verified spawn sources. x86_64 and riscv64 Linux only.
template = ["dep:thiserror"]

[lints]
workspace = true
