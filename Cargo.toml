[workspace]
members = ["src/lingcage", "src/lingcore"]
resolver = "3"

[workspace.package]
authors = [
  "LingCage <opensource@lingcage.com>",
  "Ruoqing He <ruoqing.he@lingcage.com>",
]
edition = "2024"
homepage = "https://lingcage.com"
license = "Apache-2.0"
repository = "https://github.com/RuoqingHe/lingcage"
version = "0.1.0"

[workspace.dependencies]
acpi_tables = "0.2.1"
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2.180"
linux-loader = { version = "0.14.0", default-features = false, features = [
  "bzimage",
] }
log = "0.4.29"
seccompiler = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
smoltcp = { version = "0.13.1", default-features = false, features = [
  "auto-icmp-echo-reply",
  "medium-ethernet",
  "proto-dhcpv4",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
  "std",
] }
thiserror = "2.0.18"
vm-fdt = "0.3.0"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vmm-sys-util = "0.15.0"

# Member crates opt in via `lints.workspace = true`
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
