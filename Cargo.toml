[workspace]
members = ["src/lingcage", "src/lingcore"]
resolver = "3"

[workspace.package]
authors = [
  "LingCage <opensource@lingcage.com>",
  "Ruoqing He <ruoqing.he@lingcage.com>",
]
edition = "2024"
homepage = "https://lingcage.com"
license = "Apache-2.0"
repository = "https://github.com/RuoqingHe/lingcage"
version = "0.1.0"

[workspace.dependencies]
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
libc = "0.2.180"
linux-loader = { version = "0.13.2", default-features = false, features = [
  "bzimage",
  "elf",
] }
seccompiler = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
# linux-loader 0.13 takes vm-memory no higher than 0.17.1.
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }
vmm-sys-util = "0.15.0"

# Member crates opt in via `lints.workspace = true`
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
