name: LingCage Build

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile Workspace
    strategy:
      fail-fast: false
      matrix:
        platform:
          - --target x86_64-unknown-linux-gnu
    uses: ./.github/workflows/per-commit.yml
    with:
      run: RUSTFLAGS='-D warnings' cargo build --workspace --all-targets --locked ${{ matrix.platform }} --features lingcage/agent,lingcage/cli,lingcore/cli,lingcore/machine,lingcore/kvm
