name: LingCage Test

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    strategy:
      fail-fast: false
      matrix:
        platform:
          - --target x86_64-unknown-linux-gnu
    uses: ./.github/workflows/per-commit.yml
    with:
      run: cargo test --workspace --locked ${{ matrix.platform }} --features lingcage/agent,lingcage/cli,lingcore/cli,lingcore/machine,lingcore/kvm
